name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'Backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd Backend
          npm install

      - name: Run Tests
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key
          PORT: 5000
        run: |
          cd Backend
          npm test